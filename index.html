@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Leitura completa do banco (páginas de 1000 linhas) */
async function pull(){
  try{
    const rd=async(tab,ord)=>{const out=[];for(let f=0;;f+=1000){const{data,error}=await sb.from(tab).select("*").order(ord).range(f,f+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}};
    const[pf,en,wa,we,cf]=await Promise.all([rd("profiles","user_id"),rd("food_entries","id"),rd("water_logs","day"),rd("weight_logs","day"),rd("custom_foods","id")]);
    return{s:fromDB(pf[0],en,wa,we,cf),vazio:!pf.length&&!en.length&&!wa.length&&!we.length&&!cf.length};
  }catch(e){net="off";paintNet();return null}
}
async function syncAll(){
  if(!U||!sb||busy)return;
  busy=true;const me=U.id;
  try{
    if(!await flush()&&readQ(me).length)return;
    const d=await pull();
    if(!d||!U||U.id!==me||readQ(me).length)return;
    lastPull=Date.now();net="ok";
    const RK="pratocheio:recusou:"+me;
    if(d.vazio&&!lsGet(RK)){
      const g=guestData();
      if(g){
        if(confirm("Enviar os dados deste navegador (modo visitante) para a sua conta? Os dados do visitante continuam neste navegador.")){importar(g);return}
        lsSet(RK,"1");
      }
    }
    S=d.s;save();paintNet();softRender();
  }finally{busy=false}
}

function guestData(){
  try{
    const o=JSON.parse(lsGet("pratocheio"));if(!o||typeof o!=="object")return null;
    const d=def().p,temLog=Object.values(o.log&&typeof o.log==="object"?o.log:{}).some(x=>x&&typeof x==="object"&&Object.values(x).some(a=>Array.isArray(a)&&a.length));
    const temP=o.p&&typeof o.p==="object"&&Object.keys(d).some(k=>o.p[k]!==undefined&&o.p[k]!==d[k]);
    const tem=temLog||temP||Object.keys(o.water||{}).length||Object.keys(o.weights||{}).length||(Array.isArray(o.custom)&&o.custom.length);
    return tem?o:null;
  }catch(e){return null}

function importar(o){
  const P={...def().p,...(o.p&&typeof o.p==="object"?o.p:{})},R={en:[],wa:[],we:[],cf:[]},t0=Date.now();
  const L=o.log&&typeof o.log==="object"?o.log:{};
  for(const day in L){
    if(!DAY.test(day)||!L[day]||typeof L[day]!=="object")continue;
    for(const[m]of MEALS){const a=L[day][m];if(Array.isArray(a))a.forEach(e=>{if(e&&typeof e==="object")R.en.push({...rowEntry(m,day,{...e,id:uid()}),created_at:new Date(t0+R.en.length).toISOString()})})}
  }
  const W=o.water&&typeof o.water==="object"?o.water:{},H=o.weights&&typeof o.weights==="object"?o.weights:{};
  for(const day in W)if(DAY.test(day))R.wa.push({user_id:U.id,day,ml:Math.round(cl(W[day],0,20000,0))});
  for(const day in H)if(DAY.test(day)&&+H[day]>0)R.we.push({user_id:U.id,day,kg:cl(H[day],10,500,70)});
  (Array.isArray(o.custom)?o.custom:[]).forEach((f,i)=>{if(f&&typeof f==="object")R.cf.push({...rowCustom({...f,id:uid()}),created_at:new Date(t0-i).toISOString()})});
  const pf=rowProfile(P),ops=[{i:uid(),t:"profile.set",d:pf}],chunk=(t,a)=>{for(let i=0;i<a.length;i+=200)ops.push({i:uid(),t,d:a.slice(i,i+200)})};
  chunk("food.add",R.cf);chunk("entry.add",R.en);chunk("water.set",R.wa);chunk("weight.set",R.we);
  S=fromDB(pf,R.en,R.wa,R.we,R.cf);
  writeQ(readQ().concat(ops));save();render();flush();
  toast("Dados enviados para a sua conta.");
}

  let b="";
  if(sh.food){const f=sh.food,u=ud(f),m=u[2]/100;b=`<button class="sec btn" data-a="back" style="width:auto;padding:6px 12px;margin-bottom:12px">‹ Voltar</button><h3>${esc(f.n)}</h3><p class="note" style="margin:2px 0 12px">1 ${u[0]} (${u[2]} g): ${fmt(f.k*m)} kcal · C ${f1(f.c*m)} · P ${f1(f.p*m)} · G ${f1(f.f*m)}</p><div class="grid2"><div><label>Quantidade</label><input id="gr" type="number" inputmode="decimal" step="any" value="1"></div><div><label>Medida</label><select id="un"><option value="u">${esc(u[1])}</option><option value="g">gramas</option></select></div></div><div class="pv" id="pv"></div><button class="btn" data-a="addfood">Adicionar ao ${mn.toLowerCase()}</button>`}
  else b=`<div class="tabs"><button data-a="tab" data-t="buscar" class="${sh.tab==="buscar"?"on":""}">Buscar</button><button data-a="tab" data-t="criar" class="${sh.tab==="criar"?"on":""}">Novo alimento</button></div>`+(sh.tab==="buscar"?`<input id="q" type="search" placeholder="Buscar alimento, ex.: arroz" autocomplete="off"><div class="list" id="list"></div>`:`<div class="field"><label>Nome</label><input id="nf_n" placeholder="Ex.: Pão de queijo"></div><div class="grid2"><div><label>Unidade (ex.: fatia)</label><input id="nf_u" placeholder="unidade"></div><div><label>Peso da unidade (g)</label><input id="nf_ug" type="number" inputmode="decimal" value="100"></div></div><p class="note" style="margin:0 0 8px">Informe os valores nutricionais por 100 g</p><div class="grid2"><div><label>Calorias (kcal)</label><input id="nf_k" type="number" inputmode="decimal"></div><div><label>Carboidratos (g)</label><input id="nf_c" type="number" inputmode="decimal"></div><div><label>Proteínas (g)</label><input id="nf_p" type="number" inputmode="decimal"></div><div><label>Gorduras (g)</label><input id="nf_f" type="number" inputmode="decimal"></div></div><button class="btn" data-a="newfood">Salvar alimento</button>`);
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="Adicionar alimento"><div class="hd"><h2 style="margin:0">${mn}</h2><button class="rnd" data-a="close" aria-label="Fechar">×</button></div>${b}</div>`;
  if(!sh.food&&sh.tab==="buscar"){list("");$("#q").focus()}
  if(sh.food)pv();
}
function list(q){
  q=q.trim().toLowerCase();const all=[...S.custom,...FOODS],r=(q?all.filter(f=>f.n.toLowerCase().includes(q)):all).slice(0,40);
  window._r=r;$("#list").innerHTML=r.length?r.map((f,i)=>{const u=ud(f);return`<button class="food" data-a="pick" data-i="${i}"><div>${esc(f.n)}<br><span>1 ${esc(u[0])} · ${u[2]} g</span></div><b>${fmt(f.k*u[2]/100)} kcal</b></button>`}).join(""):`<p class="empty">Nenhum resultado. Use "Novo alimento" para cadastrar.</p>`;
}
function pv(){const f=sh.food,g=grams(),r=g/100;$("#pv").innerHTML=[["kcal",f.k*r],["Carb.",f.c*r],["Prot.",f.p*r],["Gord.",f.f*r]].map(x=>`<div><b>${x[0]==="kcal"?fmt(x[1]):f1(x[1])}</b><small>${x[0]}</small></div>`).join("")}
document.addEventListener("input",e=>{if(e.target.id==="q")list(e.target.value);if(e.target.id==="un")$("#gr").value=e.target.value==="u"?1:ud(sh.food)[2];if(e.target.id==="gr"||e.target.id==="un")pv()});
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet();return}
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,k=key(cur);
  if(a==="view"){view=t.dataset.v;render();scrollTo(0,0)}
  else if(a==="day"){cur.setDate(cur.getDate()+ +t.dataset.d);render()}
  else if(a==="open")openSheet(t.dataset.m);
  else if(a==="close")closeSheet();
  else if(a==="tab"){sh.tab=t.dataset.t;drawSheet()}
  else if(a==="back"){sh.food=null;drawSheet()}
  else if(a==="pick"){sh.food=window._r[+t.dataset.i];drawSheet()}
  else if(a==="addfood"){const f=sh.food,u=ud(f),qv=+$("#gr").value,g=grams();if(!(g>0)){$("#gr").focus();return}const r=g/100,m=sh.m,e={id:uid(),n:f.n,g,q:$("#un").value==="u"?qs(qv,u):"",k:f.k*r,c:f.c*r,p:f.p*r,f:f.f*r};day(k)[m].push(e);commit("entry.add",()=>rowEntry(m,k,e));closeSheet();render()}
  else if(a==="newfood"){const n=$("#nf_n").value.trim(),v=id=>+$("#nf_"+id).value||0;if(!n){$("#nf_n").focus();return}const un=$("#nf_u").value.trim()||"unidade",f={id:uid(),n,k:v("k"),c:v("c"),p:v("p"),f:v("f"),u:[un,un==="unidade"?"unidades":un,v("ug")||100]};S.custom.unshift(f);commit("food.add",()=>rowCustom(f));sh.food=f;drawSheet()}
  else if(a==="del"){const e=day(k)[t.dataset.m].splice(+t.dataset.i,1)[0];commit("entry.del",()=>e&&e.id?{id:e.id}:null);render()}
  else if(a==="water"){S.water[k]=Math.max(0,(S.water[k]||0)+ +t.dataset.d);commit("water.set",()=>({user_id:U.id,day:k,ml:Math.round(cl(S.water[k],0,20000,0))}));render()}
  else if(a==="savew"){const v=parseFloat($("#wt").value);if(v>0){const dk=key(new Date());S.weights[dk]=v;S.p.w=v;commit("weight.set",()=>({user_id:U.id,day:dk,kg:cl(v,10,500,70)}));commit("profile.set",()=>rowProfile(S.p));render()}}
  else if(a==="calc"){$("#pf_kcal").value=suggest(readP())}
  else if(a==="savep"){S.p=readP();commit("profile.set",()=>rowProfile(S.p));view="diario";render()}
  else if(a==="login")login();
  else if(a==="logout")logout();
  else if(a==="reset"){if(confirm(U?"Apagar todos os registros e metas da sua conta? Os dados do modo visitante deste navegador não serão apagados.":"Apagar todos os registros e metas do modo visitante deste navegador? Os dados das contas não serão apagados.")){resetAll();render()}}
});
addEventListener("online",()=>{if(U&&sb&&ready)syncAll()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&U&&sb&&ready&&Date.now()-lastPull>30000)syncAll()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sh)closeSheet()});
render();
if(loginErr)toast("Não foi possível entrar com o Google. Tente novamente.");
</script>
