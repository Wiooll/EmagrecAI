.bcw{margin:12px 0 0}

@media (max-width:359px){

function installCard(){
  if(standalone())return"";
  if(instEv)return`<div class="card"><h2>Instalar app</h2><p class="note" style="margin:0 0 12px">Instale o EmagrecAI na tela inicial para abrir em tela cheia e usar sem internet.</p><button class="btn" data-a="install">Instalar</button></div>`;
  if(ehIOS())return`<div class="card"><h2>Instalar app</h2><p class="note" style="margin:0">No Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. O app abre em tela cheia e funciona sem internet.</p></div>`;
  return"";
}
function instalar(){
  const ev=instEv;if(!ev)return;
  instEv=null;
  try{ev.prompt()}catch(e){}
  render();
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEv=e;if(view==="perfil")softRender()});
addEventListener("appinstalled",()=>{instEv=null;if(view==="perfil")softRender()});
function atualizarApp(){
  if(!swNovo)return;
  recarregando=true;swNovo.postMessage({t:"SKIP_WAITING"});
}
function avisarAtualizacao(w){
  if(!w||!navigator.serviceWorker.controller)return;
  swNovo=w;$("#upd").hidden=false;
}
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(recarregando){recarregando=false;location.reload()}});
  addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      avisarAtualizacao(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state==="installed")avisarAtualizacao(w)})});
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(e=>console.warn("Service worker não registrado:",e&&e.message))
  });
}
/* Teclado virtual: no iOS o teclado não redimensiona a página; a folha acompanha a área visível. */
if(window.visualViewport){
  const vv=visualViewport,s=()=>{const el=$("#sheet");if(!el)return;if(vv.scale>1.05){el.style.removeProperty("--vvh");el.style.removeProperty("--vvt");return}el.style.setProperty("--vvh",vv.height+"px");el.style.setProperty("--vvt",vv.offsetTop+"px")};
  vv.addEventListener("resize",s);vv.addEventListener("scroll",s);s();
}
render();
if(loginErr)toast("Não foi possível entrar com o Google. Tente novamente.");
